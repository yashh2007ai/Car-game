<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Car Racing Game</title>
    <!-- Three.js Library for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }

        /* Game HUD Overlay */
        #ui {
            position: absolute;
            top: 20px; left: 20px;
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            z-index: 10;
        }

        /* Game Over Screen */
        #gameOverBox {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #38bdf8;
            padding: 30px 50px;
            border-radius: 20px;
            text-align: center;
            color: #fff;
            z-index: 20;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
        }

        #gameOverBox h1 { font-size: 2.5rem; color: #ef4444; margin-bottom: 10px; }
        #restartBtn {
            margin-top: 20px;
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Mobile Touch Controls */
        .controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 10;
        }

        .touch-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            width: 80px; height: 80px;
            border-radius: 50%;
            font-size: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui">Score: <span id="scoreText">0</span></div>

    <div id="gameOverBox">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button id="restartBtn" onclick="restartGame()">Play Again 🔄</button>
    </div>

    <!-- Mobile Screen Touch Buttons -->
    <div class="controls">
        <div class="touch-btn" onclick="moveLeft()">◀</div>
        <div class="touch-btn" onclick="moveRight()">▶</div>
    </div>

    <script>
        let scene, camera, renderer;
        let playerCar, road;
        let obstacles = [];
        let score = 0;
        let isGameOver = false;
        let carX = 0;
        let speed = 0.4;

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            // 2. Camera Setup (3D Perspective)
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 8);
            camera.lookAt(0, 0, -5);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 4. Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // 5. Create Road
            const roadGeometry = new THREE.PlaneGeometry(8, 200);
            const roadMaterial = new THREE.MeshPhongMaterial({ color: 0x334155 });
            road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -90;
            scene.add(road);

            // 6. Create 3D Player Car (Red Box Model)
            const carGeometry = new THREE.BoxGeometry(1.2, 0.6, 2);
            const carMaterial = new THREE.MeshPhongMaterial({ color: 0xef4444 });
            playerCar = new THREE.Mesh(carGeometry, carMaterial);
            playerCar.position.set(0, 0.3, 3);
            scene.add(playerCar);

            // Controls listeners
            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('resize', onWindowResize);

            // Start Game Loop
            animate();
            spawnObstacleTimer();
        }

        // Spawn 3D Yellow Obstacle Blocks
        function spawnObstacle() {
            if (isGameOver) return;
            const obsGeometry = new THREE.BoxGeometry(1.2, 0.8, 1.2);
            const obsMaterial = new THREE.MeshPhongMaterial({ color: 0xeab308 });
            const obstacle = new THREE.Mesh(obsGeometry, obsMaterial);

            // Random 3 Lanes (-2.5, 0, 2.5)
            const lanes = [-2.5, 0, 2.5];
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];

            obstacle.position.set(randomLane, 0.4, -60);
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function spawnObstacleTimer() {
            setInterval(() => {
                if (!isGameOver) spawnObstacle();
            }, 1200);
        }

        // Left Right Controls
        function moveLeft() {
            if (!isGameOver && playerCar.position.x > -2.5) {
                playerCar.position.x -= 2.5;
            }
        }

        function moveRight() {
            if (!isGameOver && playerCar.position.x < 2.5) {
                playerCar.position.x += 2.5;
            }
        }

        function onKeyDown(e) {
            if (e.key === "ArrowLeft" || e.key === "a") moveLeft();
            if (e.key === "ArrowRight" || e.key === "d") moveRight();
        }

        // Main Animation Loop
        function animate() {
            if (!isGameOver) {
                requestAnimationFrame(animate);

                // Move & Check Obstacles
                for (let i = 0; i < obstacles.length; i++) {
                    let obs = obstacles[i];
                    obs.position.z += speed;

                    // Collision Detection Logic
                    if (Math.abs(obs.position.z - playerCar.position.z) < 1.2 &&
                        Math.abs(obs.position.x - playerCar.position.x) < 0.8) {
                        endGame();
                    }

                    // Remove out of screen obstacles & add score
                    if (obs.position.z > 8) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        i--;
                        score += 10;
                        document.getElementById('scoreText').innerText = score;
                    }
                }

                renderer.render(scene, camera);
            }
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('finalScore').innerText = score;
            document.getElementById('gameOverBox').style.display = "block";
        }

        function restartGame() {
            // Clear current obstacles
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];

            // Reset States
            score = 0;
            playerCar.position.x = 0;
            isGameOver = false;
            document.getElementById('scoreText').innerText = "0";
            document.getElementById('gameOverBox').style.display = "none";

            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start Game
        init();
    </script>
</body>
</html>
